<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>АпТакси — инвестиционный рост</title>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #0f0f0f, #050505);
  color: #00ff88;
  text-align: center;
  padding: 16px;
}

.box {
  max-width: 460px;
  margin: auto;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 0 25px rgba(0,255,136,0.15);
}

h2 { margin-bottom: 10px; }

.block {
  text-align: left;
  margin-bottom: 12px;
}

.label {
  font-size: 13px;
  opacity: 0.8;
}

select, input {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #00ff88;
  background: #0f0f0f;
  color: #00ff88;
}

.result {
  font-size: 26px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(0,255,136,0.2);
}

canvas {
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="box">

<h2>📈 Инвестиционный рост АпТакси</h2>

<div class="block">
  <div class="label">Старт рефералов</div>
  <input type="number" id="start" value="100">
</div>

<div class="block">
  <div class="label">Рост сети в месяц (%)</div>
  <input type="number" id="growth" value="25">
</div>

<div class="block">
  <div class="label">Оборот с человека (₽)</div>
  <input type="number" id="turnover" value="5000">
</div>

<div class="block">
  <div class="label">Сценарий</div>
  <select id="scenario">
    <option value="0.6">Консервативный</option>
    <option value="1">Нормальный</option>
    <option value="1.5">Агрессивный</option>
  </select>
</div>

<div class="result" id="result">0 ₽ / месяц</div>

<canvas id="chart" height="180"></canvas>

</div>

<script>
vkBridge.send("VKWebAppInit");

const start = document.getElementById("start");
const growth = document.getElementById("growth");
const turnover = document.getElementById("turnover");
const scenario = document.getElementById("scenario");

const result = document.getElementById("result");

const ctx = document.getElementById("chart");

const chart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [{
      label: "Доход ₽",
      data: [],
      borderColor: "#00ff88",
      tension: 0.4
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      x: { display: true },
      y: { display: true }
    }
  }
});

function calc() {

  let users = +start.value;
  let g = (+growth.value / 100) * +scenario.value;
  let t = +turnover.value;

  let data = [];
  let labels = [];

  let totalIncome = 0;

  for (let m = 1; m <= 12; m++) {
    users = users * (1 + g);

    let income = users * t * 0.01; // средняя комиссия сети
    data.push(Math.round(income));
    labels.push("M" + m);

    if (m === 12) totalIncome = income;
  }

  chart.data.labels = labels;
  chart.data.datasets[0].data = data;
  chart.update();

  result.innerText =
    "Прогноз: " +
    Math.round(totalIncome).toLocaleString("ru-RU") +
    " ₽ / месяц";
}

[start, growth, turnover, scenario].forEach(el => {
  el.addEventListener("input", calc);
});

calc();
</script>

</body>
</html>
