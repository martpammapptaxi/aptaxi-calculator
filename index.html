<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>АпТакси — бизнес симулятор</title>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #0f0f0f, #050505);
  color: #00ff88;
  text-align: center;
  padding: 16px;
}

.box {
  max-width: 480px;
  margin: auto;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 0 25px rgba(0,255,136,0.15);
}

h2 { margin-bottom: 10px; }

.block {
  text-align: left;
  margin-bottom: 10px;
}

.label {
  font-size: 13px;
  opacity: 0.8;
}

input, select {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #00ff88;
  background: #0f0f0f;
  color: #00ff88;
}

.result {
  font-size: 24px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(0,255,136,0.2);
}

.event {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.9;
  min-height: 20px;
}

canvas {
  margin-top: 12px;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #00ff88;
  color: black;
  font-weight: bold;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="box">

<h2>🚕 Бизнес-симулятор АпТакси</h2>

<div class="block">
  <div class="label">Старт пользователей</div>
  <input id="start" type="number" value="100">
</div>

<div class="block">
  <div class="label">Рост сети (% в месяц)</div>
  <input id="growth" type="number" value="25">
</div>

<div class="block">
  <div class="label">Оборот с человека (₽)</div>
  <input id="turnover" type="number" value="5000">
</div>

<div class="block">
  <div class="label">Апгрейд системы</div>
  <select id="upgrade">
    <option value="1">Базовый</option>
    <option value="1.2">Оптимизированный (+20%)</option>
    <option value="1.5">Автоматизация (+50%)</option>
    <option value="2">AI рост (+100%)</option>
  </select>
</div>

<button onclick="runMonth()">▶ Симулировать месяц</button>

<div class="event" id="event"></div>

<div class="result" id="result">0 ₽</div>

<canvas id="chart" height="180"></canvas>

</div>

<script>
vkBridge.send("VKWebAppInit");

let users = 100;
let incomeHistory = [];

const chart = new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: [],
    datasets: [{
      label: "Доход",
      data: [],
      borderColor: "#00ff88",
      tension: 0.4
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      x: { display: true },
      y: { display: true }
    }
  }
});

function randomEvent() {
  const r = Math.random();

  if (r < 0.2) {
    return { text: "📉 Конкурент перехватил часть рынка (-10%)", impact: 0.9 };
  }
  if (r < 0.4) {
    return { text: "🚀 Реклама дала рост (+20%)", impact: 1.2 };
  }
  if (r < 0.5) {
    return { text: "⚡ Вирусный эффект (+35%)", impact: 1.35 };
  }
  return { text: "📊 Стабильный рынок", impact: 1 };
}

function runMonth() {

  const growth = +document.getElementById("growth").value / 100;
  const turnover = +document.getElementById("turnover").value;
  const upgrade = +document.getElementById("upgrade").value;

  // рост пользователей
  users = users * (1 + growth);

  // случайное событие
  const ev = randomEvent();
  users = users * ev.impact;

  document.getElementById("event").innerText = ev.text;

  // доход
  const income = users * turnover * 0.01 * upgrade;

  incomeHistory.push(Math.round(income));

  // обновление UI
  document.getElementById("result").innerText =
    Math.round(income).toLocaleString("ru-RU") + " ₽ / месяц";

  chart.data.labels.push("М" + incomeHistory.length);
  chart.data.datasets[0].data = incomeHistory;
  chart.update();
}
</script>

</body>
</html>
